<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b2140">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Criaturas Criollas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #2b2140;
  color: #e8e0ff;
  font-family: "Press Start 2P", monospace;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#consola {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  padding: 8px;
}
#marco {
  padding: 6px;
  background: #141020;
  border-radius: 10px;
  box-shadow: 0 0 0 3px #4a3a6a, 0 8px 24px #0008;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#controles {
  display: none;
  width: 100%;
  max-width: 520px;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px;
}
body.tactil #controles { display: flex; }
body.tactil #ayuda { display: none; }
@media (pointer: coarse) {
  #controles { display: flex; }
  #ayuda { display: none; }
}
.cruz {
  display: grid;
  grid-template-columns: repeat(3, 54px);
  grid-template-rows: repeat(3, 54px);
}
.cruz .arriba { grid-area: 1 / 2; }
.cruz .izq { grid-area: 2 / 1; }
.cruz .der { grid-area: 2 / 3; }
.cruz .abajo { grid-area: 3 / 2; }
button {
  background: #3a3054;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  box-shadow: 0 4px 0 #1a1428;
  touch-action: none;
}
button.on { transform: translateY(3px); box-shadow: 0 1px 0 #1a1428; }
.ab { display: flex; gap: 14px; align-items: center; }
.ab button { width: 66px; height: 66px; border-radius: 50%; font-size: 18px; }
.ab .a { background: #c83a4a; margin-bottom: 30px; }
.ab .b { background: #8a3a6a; margin-top: 30px; }
.start { padding: 10px 12px; font-size: 9px; border-radius: 14px; }
#ayuda { font-size: 9px; opacity: .7; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div id="consola">
  <div id="marco"><canvas id="pantalla" width="240" height="160"></canvas></div>
  <div id="controles">
    <div class="cruz">
      <button data-k="up" class="arriba">▲</button>
      <button data-k="left" class="izq">◀</button>
      <button data-k="right" class="der">▶</button>
      <button data-k="down" class="abajo">▼</button>
    </div>
    <div class="centro"><button data-k="start" class="start">MENÚ</button></div>
    <div class="ab">
      <button data-k="b" class="b">B</button>
      <button data-k="a" class="a">A</button>
    </div>
  </div>
  <p id="ayuda">Flechas: caminar &nbsp;·&nbsp; Z: A &nbsp;·&nbsp; X: B (mantener para correr) &nbsp;·&nbsp; Enter o M: menú</p>
</div>
<script>
// ===== sprites.js =====
'use strict';
// ===== Motor de pixel-art: dibuja sprites a partir de figuras simples =====

function hexRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
const _cacheTono = {};
// f < 1 oscurece, f > 1 aclara
function tono(h, f) {
  const k = h + f;
  if (_cacheTono[k]) return _cacheTono[k];
  const [r, g, b] = hexRgb(h);
  let out;
  if (f < 1) out = rgbHex(r * f, g * f, b * f);
  else out = rgbHex(r + (255 - r) * (f - 1), g + (255 - g) * (f - 1), b + (255 - b) * (f - 1));
  _cacheTono[k] = out;
  return out;
}
function nuevoCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function enPoligono(x, y, pts) {
  let dentro = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) dentro = !dentro;
  }
  return dentro;
}
// Línea de puntos (Bresenham) como lista de primitivas 'd'
function linea(x0, y0, x1, y1, c) {
  const out = [];
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  while (true) {
    out.push(['d', x0, y0, c]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return out;
}

// Primitivas:
//  ['e', cx, cy, rx, ry, color, flags]  elipse (con sombreado automático)
//  ['r', x, y, w, h, color, flags]      rectángulo
//  ['p', [[x,y],...], color, flags]     polígono
//  ['d', x, y, color, flags]            punto
// flags: 'c' = solo pinta sobre lo ya pintado, 's' = sin sombreado
function rasterizar(tam, prims, op = {}) {
  const sombra = op.sombra !== false, borde = op.borde !== false;
  const g = new Array(tam * tam).fill(null);
  for (const p of prims) {
    const t = p[0];
    const flag = (t === 'p' ? p[3] : t === 'd' ? p[4] : p[6]) || '';
    const clip = flag.includes('c'), sinSombra = flag.includes('s');
    for (let py = 0; py < tam; py++) {
      for (let px = 0; px < tam; px++) {
        const x = px + 0.5, y = py + 0.5, i = py * tam + px;
        let col = null;
        if (t === 'e') {
          const nx = (x - p[1]) / p[3], ny = (y - p[2]) / p[4];
          if (nx * nx + ny * ny <= 1) {
            col = p[5];
            if (sombra && !sinSombra) {
              if (ny > 0.5 || nx > 0.72) col = tono(col, 0.8);
              else if (ny < -0.45 && nx < 0) col = tono(col, 1.2);
            }
          }
        } else if (t === 'r') {
          if (x >= p[1] && x < p[1] + p[3] && y >= p[2] && y < p[2] + p[4]) col = p[5];
        } else if (t === 'p') {
          if (enPoligono(x, y, p[1])) col = p[2];
        } else if (t === 'd') {
          if (px === p[1] && py === p[2]) col = p[3];
        }
        if (col === null) continue;
        if (clip && !g[i]) continue;
        g[i] = col;
      }
    }
  }
  let out = g;
  if (borde) {
    out = g.slice();
    for (let py = 0; py < tam; py++) {
      for (let px = 0; px < tam; px++) {
        const i = py * tam + px;
        if (g[i]) continue;
        let n = null;
        if (px > 0 && g[i - 1]) n = g[i - 1];
        else if (px < tam - 1 && g[i + 1]) n = g[i + 1];
        else if (py > 0 && g[i - tam]) n = g[i - tam];
        else if (py < tam - 1 && g[i + tam]) n = g[i + tam];
        if (n) out[i] = tono(n, 0.32);
      }
    }
  }
  const c = nuevoCanvas(tam, tam), ctx = c.getContext('2d'), img = ctx.createImageData(tam, tam);
  for (let i = 0; i < out.length; i++) {
    if (!out[i]) continue;
    const [r, gg, bb] = hexRgb(out[i]);
    img.data[i * 4] = r; img.data[i * 4 + 1] = gg; img.data[i * 4 + 2] = bb; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
function espejar(c) {
  const m = nuevoCanvas(c.width, c.height), x = m.getContext('2d');
  x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return m;
}
// Versión en blanco (para destellos de evolución / captura)
function silueta(c, color = '#ffffff') {
  const m = nuevoCanvas(c.width, c.height), x = m.getContext('2d');
  x.drawImage(c, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return m;
}

// ===== Personajes humanos (16x16) =====
// dir: 0 abajo, 1 arriba, 2 izquierda, 3 derecha · frame: 0 parado, 1 y 2 caminando
const _cacheChar = {};
function spriteChar(pal, dir, frame) {
  const clave = pal.id + '_' + dir + '_' + frame;
  if (_cacheChar[clave]) return _cacheChar[clave];
  if (dir === 3) {
    const c = espejar(spriteChar(pal, 2, frame));
    _cacheChar[clave] = c;
    return c;
  }
  const P = [];
  const OJO = '#202020';
  if (dir === 0 || dir === 1) {
    if (pal.peloLargo) P.push(['r', 3.5, 4, 9, dir === 1 ? 7 : 6, pal.pelo]);
    P.push(['r', 4, 9, 8, pal.guardapolvo ? 5 : 4, pal.remera]);
    if (pal.raya) P.push(['r', 6, 9, 1, 4, pal.raya, 'c'], ['r', 9, 9, 1, 4, pal.raya, 'c']);
    P.push(['r', 3, 9, 1, 3, pal.piel], ['r', 12, 9, 1, 3, pal.piel]);
    if (frame === 0) P.push(['r', 5, 13, 2, 2, pal.pant], ['r', 9, 13, 2, 2, pal.pant]);
    else if (frame === 1) P.push(['r', 5, 13, 2, 2, pal.pant], ['r', 9, 13, 2, 1, pal.pant]);
    else P.push(['r', 5, 13, 2, 1, pal.pant], ['r', 9, 13, 2, 2, pal.pant]);
    P.push(['e', 8, 5.5, 4, 4, pal.piel]);
    if (dir === 1) P.push(['e', 8, 5, 4.3, 4.2, pal.pelo]);
    if (pal.gorra) {
      P.push(['e', 8, 3.2, 4.5, 2.6, pal.gorra]);
      if (dir === 0) P.push(['r', 4, 4.5, 8, 1, tono(pal.gorra, 0.72)], ['r', 4, 5.5, 1, 1.5, pal.pelo], ['r', 11, 5.5, 1, 1.5, pal.pelo]);
    } else if (pal.boina) {
      P.push(['e', 8, 2.8, 4.7, 2.2, pal.boina]);
      if (dir === 0) P.push(['r', 4, 4, 1, 2, pal.pelo], ['r', 11, 4, 1, 2, pal.pelo]);
    } else if (pal.sombrero) {
      P.push(['r', 2, 3.5, 12, 1.2, pal.sombrero], ['e', 8, 2.6, 3.6, 2, pal.sombrero]);
    } else if (dir === 0) {
      P.push(['e', 8, 3.5, 4.4, 2.6, pal.pelo]);
    }
    if (dir === 0) {
      P.push(['r', 6, 6, 1, 2, OJO], ['r', 9, 6, 1, 2, OJO]);
      if (pal.barba) P.push(['r', 5, 8, 6, 1.5, pal.barba]);
    }
  } else {
    if (pal.peloLargo) P.push(['r', 8, 4, 4.5, 6, pal.pelo]);
    P.push(['r', 5, 9, 6, pal.guardapolvo ? 5 : 4, pal.remera]);
    if (pal.raya) P.push(['r', 8, 9, 1, 4, pal.raya, 'c']);
    if (frame === 0) P.push(['r', 6, 13, 2, 2, pal.pant], ['r', 8, 13, 2, 2, pal.pant]);
    else if (frame === 1) P.push(['r', 5, 13, 2, 2, pal.pant], ['r', 9, 13, 2, 2, pal.pant]);
    else P.push(['r', 6, 13, 2, 2, pal.pant], ['r', 9, 13, 2, 1, pal.pant]);
    P.push(['r', 7.5, 9.5, 2, 3, pal.piel]);
    P.push(['e', 8, 5.5, 4, 4, pal.piel]);
    if (pal.gorra) {
      P.push(['e', 8.5, 3.2, 4.4, 2.6, pal.gorra], ['r', 3, 4.5, 5, 1, tono(pal.gorra, 0.72)], ['r', 10, 4.5, 2.5, 4, pal.pelo]);
    } else if (pal.boina) {
      P.push(['e', 8.5, 2.8, 4.6, 2.2, pal.boina], ['r', 10, 4, 2.5, 3, pal.pelo]);
    } else if (pal.sombrero) {
      P.push(['r', 2, 3.5, 12, 1.2, pal.sombrero], ['e', 8, 2.6, 3.6, 2, pal.sombrero], ['r', 10, 4.5, 2.5, 3, pal.pelo]);
    } else {
      P.push(['e', 9, 3.5, 4.2, 2.6, pal.pelo], ['r', 10, 4, 2.5, 4, pal.pelo]);
    }
    P.push(['r', 5, 6, 1, 2, OJO]);
    if (pal.barba) P.push(['r', 4, 8, 4, 1.5, pal.barba]);
  }
  const c = rasterizar(16, P, { sombra: false });
  _cacheChar[clave] = c;
  return c;
}

// ===== Criaturas =====
// Dibujos de Felipe pasados a pixel-art (img/ -> js/imagenes.js).
// Si una especie tiene dibujo se usa ese; si no, el sprite hecho con figuras.
const _dibujos = {};
function precargarDibujos() {
  const lista = typeof IMAGENES === 'undefined' ? [] : Object.entries(IMAGENES);
  return Promise.all(lista.map(([id, src]) => new Promise(listo => {
    const im = new Image();
    im.onload = () => {
      const c = nuevoCanvas(im.width, im.height);
      c.getContext('2d').drawImage(im, 0, 0);
      _dibujos[id] = c;
      listo();
    };
    im.onerror = listo;
    im.src = src;
  })));
}
const _cacheCriatura = {};
function spriteCriatura(id, espalda) {
  const clave = id + (espalda ? '_b' : '');
  if (_cacheCriatura[clave]) return _cacheCriatura[clave];
  let c;
  if (_dibujos[id]) {
    c = espalda ? (_dibujos[id + '_espalda'] || espejar(_dibujos[id])) : _dibujos[id];
    _cacheCriatura[clave] = c;
    return c;
  }
  c = rasterizar(32, ESPECIES[id].sprite);
  if (espalda) c = espejar(c);
  _cacheCriatura[clave] = c;
  return c;
}

// ===== Boleadora (la "pokebola" criolla) =====
let _boleadora = null;
function spriteBoleadora() {
  if (_boleadora) return _boleadora;
  const P = [
    ...linea(8, 5, 4, 11, '#5a3a1a'),
    ...linea(8, 5, 12, 11, '#5a3a1a'),
    ['e', 8, 4.5, 2.7, 2.7, '#c08850'],
    ['e', 4, 11.5, 2.7, 2.7, '#c08850'],
    ['e', 12, 11.5, 2.7, 2.7, '#c08850'],
    ['r', 5, 4, 6, 1, '#6cb4ee', 'c'],
    ['r', 1, 11, 6, 1, '#6cb4ee', 'c'],
    ['r', 9, 11, 6, 1, '#6cb4ee', 'c'],
  ];
  _boleadora = rasterizar(16, P);
  return _boleadora;
}

// ===== Baldosas del mapa (16x16) =====
function crearTiles() {
  const t = {};
  const mk = fn => { const c = nuevoCanvas(16, 16), x = c.getContext('2d'); fn(x); return c; };
  const R = (x, a, b, w, h, c) => { x.fillStyle = c; x.fillRect(a, b, w, h); };
  const pasto = x => {
    R(x, 0, 0, 16, 16, '#88d070');
    for (const [a, b] of [[2, 3], [10, 1], [6, 9], [12, 11], [1, 13], [13, 6]]) {
      R(x, a, b, 1, 1, '#68b050'); R(x, a + 2, b, 1, 1, '#68b050'); R(x, a + 1, b + 1, 1, 1, '#68b050');
    }
  };
  const piso = x => {
    R(x, 0, 0, 16, 16, '#ecd29a');
    for (const y of [3, 7, 11, 15]) R(x, 0, y, 16, 1, '#d4b070');
    R(x, 4, 0, 1, 3, '#d4b070'); R(x, 12, 4, 1, 3, '#d4b070'); R(x, 7, 8, 1, 3, '#d4b070'); R(x, 14, 12, 1, 3, '#d4b070');
  };
  const sobre = (x, prims) => x.drawImage(rasterizar(16, prims), 0, 0);

  t['.'] = mk(pasto);
  t[','] = mk(x => {
    R(x, 0, 0, 16, 16, '#58a848');
    for (let k = 0; k < 4; k++) {
      const bx = (k % 2) * 8, by = (k >> 1) * 8;
      R(x, bx, by + 7, 8, 1, '#3a8038');
      for (const [o, hh] of [[1, 5], [3, 7], [5, 6]]) {
        R(x, bx + o, by + 7 - hh, 1, hh, '#3a8038');
        R(x, bx + o + 1, by + 8 - hh, 1, hh - 1, '#70c058');
        R(x, bx + o, by + 7 - hh, 1, 1, '#98e078');
      }
    }
  });
  t['='] = mk(x => {
    R(x, 0, 0, 16, 16, '#e8d8a0');
    for (const [a, b] of [[3, 2], [11, 5], [6, 12], [13, 13], [1, 8], [8, 7]]) R(x, a, b, 1, 1, '#d0bc80');
  });
  for (let f = 0; f < 2; f++) {
    t['~' + f] = mk(x => {
      R(x, 0, 0, 16, 16, '#4898e0');
      R(x, 0, 0, 16, 1, '#3a80c8');
      R(x, 2 + f * 2, 4, 5, 1, '#a0d4ff'); R(x, 9 - f * 2, 10, 5, 1, '#a0d4ff');
      R(x, 12 - f, 1, 2, 1, '#78b8f0'); R(x, 1 + f, 13, 2, 1, '#78b8f0');
    });
  }
  t['T'] = mk(x => {
    pasto(x);
    sobre(x, [['r', 6, 11, 4, 4, '#7a4a22'], ['e', 8, 7, 6.6, 5.8, '#2e8b3a'], ['e', 5.5, 5, 2.2, 1.6, '#5cc060', 's'], ['e', 11, 9, 2, 1.4, '#227030', 's']]);
  });
  t['F'] = mk(x => {
    pasto(x);
    const flor = (cx, cy, c) => { R(x, cx - 1, cy, 3, 1, c); R(x, cx, cy - 1, 1, 3, c); R(x, cx, cy, 1, 1, '#f8e040'); };
    flor(4, 4, '#e83a3a'); flor(11, 10, '#e83a3a'); flor(12, 3, '#ffffff'); flor(4, 12, '#ffffff');
  });
  t['f'] = mk(x => {
    pasto(x);
    sobre(x, [['r', 0, 5, 16, 2, '#c08848'], ['r', 0, 10, 16, 2, '#c08848'], ['r', 2, 3, 3, 12, '#a06a30'], ['r', 11, 3, 3, 12, '#a06a30']]);
  });
  t['S'] = mk(x => {
    pasto(x);
    sobre(x, [['r', 7, 10, 2, 5, '#7a4a22'], ['r', 2, 2, 12, 8, '#c89050'], ['r', 4, 4, 8, 1, '#8a5a2a'], ['r', 4, 6, 8, 1, '#8a5a2a']]);
  });
  // Litoral: juncos/totoras en el agua y puente de madera
  t['j'] = mk(x => {
    R(x, 0, 0, 16, 16, '#4898e0');
    R(x, 2, 12, 5, 1, '#a0d4ff'); R(x, 10, 14, 4, 1, '#a0d4ff');
    for (const [a, hh] of [[2, 10], [5, 13], [8, 9], [11, 12], [13, 8]]) {
      R(x, a, 14 - hh, 1, hh, '#3a8038'); R(x, a + 1, 15 - hh, 1, hh - 2, '#70c058');
      R(x, a, 12 - hh, 2, 3, '#8a5a2a');
    }
  });
  t['h'] = mk(x => {
    R(x, 0, 0, 16, 16, '#4898e0');
    R(x, 1, 0, 14, 16, '#b07a40');
    for (const y of [3, 7, 11, 15]) R(x, 1, y, 14, 1, '#7a4a22');
    R(x, 0, 0, 1, 16, '#6a3a1a'); R(x, 15, 0, 1, 16, '#6a3a1a');
  });
  // Selva Misionera: árbol de selva, tierra colorada; cueva: roca, piso de cueva, amatistas
  t['Y'] = mk(x => {
    R(x, 0, 0, 16, 16, '#3a8a3a');
    sobre(x, [['r', 6, 10, 4, 6, '#5a3414'], ['e', 8, 6, 7.6, 6.4, '#1e6a2a'], ['e', 5, 4, 3, 2.2, '#3a9a40', 's'], ['e', 12, 8, 2.4, 2, '#145020', 's']]);
    R(x, 3, 9, 1, 6, '#2a7a2a'); R(x, 13, 7, 1, 7, '#2a7a2a');
  });
  t['q'] = mk(x => {
    R(x, 0, 0, 16, 16, '#c8603a');
    for (const [a, b] of [[3, 2], [11, 5], [6, 12], [13, 13], [1, 8], [8, 7]]) R(x, a, b, 1, 1, '#a84828');
    R(x, 9, 2, 2, 1, '#d87a50'); R(x, 2, 13, 2, 1, '#d87a50');
  });
  t['R'] = mk(x => {
    R(x, 0, 0, 16, 16, '#6a5a4a');
    sobre(x, [['e', 5, 5, 5, 4, '#8a7a68'], ['e', 12, 11, 5, 4.5, '#7a6a58'], ['e', 4, 13, 3.5, 2.5, '#8a7a68']], { borde: false });
  });
  t[':'] = mk(x => {
    R(x, 0, 0, 16, 16, '#9a8670');
    for (const [a, b] of [[3, 2], [11, 5], [6, 12], [13, 13], [1, 8], [8, 7]]) R(x, a, b, 1, 1, '#7a6852');
  });
  t['a'] = mk(x => {
    R(x, 0, 0, 16, 16, '#9a8670');
    sobre(x, [['p', [[2, 15], [5, 3], [8, 15]], '#a050e0'], ['p', [[7, 15], [10, 6], [13, 15]], '#d8a0ff'], ['p', [[11, 15], [14, 9], [15, 15]], '#a050e0']]);
  });
  // Norte: arena, paja brava (con criaturas), cerros de colores y cardones
  const arena = x => {
    R(x, 0, 0, 16, 16, '#e0c890');
    for (const [a, b] of [[3, 2], [11, 5], [6, 12], [13, 13], [1, 8], [8, 7]]) R(x, a, b, 1, 1, '#c8a870');
  };
  t['-'] = mk(arena);
  t['u'] = mk(x => {
    arena(x);
    for (let k = 0; k < 4; k++) {
      const bx = (k % 2) * 8, by = (k >> 1) * 8;
      for (const [o, hh] of [[1, 6], [3, 7], [5, 5], [6, 6]]) {
        R(x, bx + o, by + 8 - hh, 1, hh, '#a08838');
        R(x, bx + o, by + 8 - hh, 1, 1, '#d8c060');
      }
    }
  });
  t['C'] = mk(x => {
    const fr = ['#c84a3a', '#e08a3a', '#9a5aa8', '#d8b050', '#6a9a5a', '#c86a5a'];
    for (let i = 0; i < 6; i++) { R(x, 0, i * 3 - 1, 16, 3, fr[i]); }
    R(x, 0, 15, 16, 1, '#7a3a2a');
    R(x, 3, 4, 2, 1, '#f0b080'); R(x, 10, 10, 3, 1, '#c090d0');
  });
  t['K'] = mk(x => {
    arena(x);
    sobre(x, [['r', 6, 2, 4, 13, '#3a8a4a'], ['r', 2, 6, 3, 6, '#3a8a4a'], ['r', 2, 6, 2, 2, '#3a8a4a'], ['r', 11, 4, 3, 6, '#3a8a4a'],
      ['r', 7, 3, 1, 11, '#5aaa60', 'c'], ['d', 7, 1, '#f0f0a0'], ['d', 12, 3, '#f0f0a0']]);
  });
  // Lava (Gimnasio 7)
  t['L'] = mk(x => {
    R(x, 0, 0, 16, 16, '#d84010');
    R(x, 2, 3, 5, 2, '#f8a020'); R(x, 9, 9, 5, 2, '#f8a020'); R(x, 4, 12, 3, 1, '#f8d040'); R(x, 11, 2, 2, 1, '#f8d040');
    R(x, 0, 7, 3, 1, '#a02008'); R(x, 13, 14, 3, 1, '#a02008');
  });
  // Puna: salinas y cerros nevados
  t['w'] = mk(x => {
    R(x, 0, 0, 16, 16, '#f4f6f8');
    R(x, 0, 7, 16, 1, '#d8dee6'); R(x, 7, 0, 1, 7, '#d8dee6'); R(x, 3, 8, 1, 8, '#d8dee6'); R(x, 12, 8, 1, 8, '#d8dee6');
    R(x, 2, 2, 1, 1, '#ffffff'); R(x, 11, 12, 1, 1, '#ffffff');
  });
  t['N'] = mk(x => {
    R(x, 0, 0, 16, 16, '#e0c890');
    sobre(x, [['p', [[0, 16], [8, 1], [16, 16]], '#7a6a6a'], ['p', [[5, 7], [8, 1], [11, 7], [9, 6], [8, 8], [6, 6]], '#ffffff'], ['p', [[8, 1], [16, 16], [12, 16], [10, 8]], '#5a4a4a', 'c']]);
  });
  // Se rompen con el PICO: X roca (sobre arena), Z bloque de hielo (sobre nieve), O roca de cueva
  const grietas = (x, c) => { R(x, 7, 4, 1, 3, c); R(x, 8, 7, 2, 1, c); R(x, 10, 8, 1, 3, c); R(x, 5, 10, 2, 1, c); };
  t['X'] = mk(x => { arena(x); sobre(x, [['e', 8, 9, 7, 6, '#8a7a6a'], ['e', 6, 7, 3, 2, '#aa9c8a', 's']]); grietas(x, '#3a2e24'); });
  t['Z'] = mk(x => {
    t['w'] && x.drawImage(t['w'], 0, 0);
    sobre(x, [['r', 1, 2, 14, 13, '#9ad8f0'], ['r', 2, 3, 5, 4, '#d8f4ff', 's'], ['r', 1, 12, 14, 3, '#70b0d0', 's']]);
    grietas(x, '#3a78a0');
  });
  t['O'] = mk(x => {
    R(x, 0, 0, 16, 16, '#9a8670');
    sobre(x, [['e', 8, 9, 7, 6, '#6a5a4a'], ['e', 6, 7, 3, 2, '#8a7a68', 's']]);
    grietas(x, '#2a2018');
  });
  // Interiores
  t['_'] = mk(piso);
  t['#'] = mk(x => {
    R(x, 0, 0, 16, 16, '#e8dcc0');
    R(x, 0, 0, 16, 2, '#c8b490');
    R(x, 4, 2, 1, 10, '#dccfae'); R(x, 12, 2, 1, 10, '#dccfae');
    R(x, 0, 12, 16, 4, '#a87850'); R(x, 0, 12, 16, 1, '#c89868');
  });
  t['m'] = mk(x => { piso(x); R(x, 1, 3, 14, 10, '#902828'); R(x, 2, 4, 12, 8, '#c84848'); R(x, 3, 7, 10, 1, '#e87070'); });
  t['r'] = mk(x => { R(x, 0, 0, 16, 16, '#5a7ad0'); R(x, 0, 2, 16, 1, '#8aa8f0'); R(x, 0, 13, 16, 1, '#8aa8f0'); for (let i = 1; i < 16; i += 4) R(x, i, 7, 2, 2, '#f0d060'); });
  t['k'] = mk(x => {
    piso(x);
    const libros = [];
    const cols = ['#d04040', '#4060c0', '#40a050', '#e0b030', '#8040a0'];
    for (let fila = 0; fila < 3; fila++) for (let i = 0; i < 5; i++) libros.push(['r', 2 + i * 2.4, 2 + fila * 4.5, 2, 3.5, cols[(i + fila) % 5]]);
    sobre(x, [['r', 1, 0, 14, 15, '#8a5a2a'], ...libros.map(l => [...l, 'c'])]);
  });
  t['x'] = mk(x => { piso(x); sobre(x, [['r', 1, 10, 14, 5, '#a06a3a'], ['r', 3, 1, 10, 9, '#303040'], ['r', 4, 2, 8, 6, '#70b0e0', 'c']]); });
  t['p'] = mk(x => { piso(x); sobre(x, [['r', 5, 10, 6, 5, '#c0603a'], ['e', 8, 6.5, 5.5, 5, '#3a9a4a'], ['e', 5, 4, 2, 2, '#5cc060', 's']]); });
  t['b'] = mk(x => { piso(x); sobre(x, [['r', 2, 0, 12, 15, '#a06a3a'], ['r', 3, 1, 10, 13, '#f4f4f4'], ['r', 3, 6, 10, 8, '#e05050'], ['r', 3, 9, 10, 1, '#f08080']]); });
  t['t'] = mk(x => { piso(x); sobre(x, [['r', 0, 2, 16, 10, '#c48a50'], ['r', 0, 12, 16, 3, '#8a5a2a'], ['r', 1, 3, 14, 1, '#dca870', 'c']]); });
  t['o'] = t['t'];
  // Gimnasio psíquico: piso violeta y esferas sobre pedestales
  t['v'] = mk(x => {
    R(x, 0, 0, 16, 16, '#b8a0d8');
    R(x, 0, 0, 16, 1, '#a088c8'); R(x, 0, 0, 1, 16, '#a088c8');
    R(x, 7, 7, 2, 2, '#d8c8f0');
  });
  t['g'] = mk(x => {
    R(x, 0, 0, 16, 16, '#b8a0d8');

  });
  t['c'] = mk(x => { piso(x); sobre(x, [['r', 1, 8, 14, 7, '#909aa8'], ['r', 3, 1, 10, 7, '#404858'], ['r', 4, 2, 8, 5, '#80e0a0', 'c']]); });
  return t;
}

// ===== Edificios =====
function crearEdificio(tipo, w, h, puerta) {
  const c = nuevoCanvas(w * 16, h * 16), x = c.getContext('2d');
  const R = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(a, b, ww, hh); };
  const ancho = w * 16, alto = h * 16;
  const techoH = (h - 2) * 16 + 4;
  const pared = tipo === 'lab' ? '#eef2f6' : tipo.startsWith('gimnasio') ? '#ece4f4' : tipo === 'adobe' ? '#e0c08a' : tipo.startsWith('templo') ? '#d8d0c4' : '#f6eedc';
  R(2, techoH - 4, ancho - 4, alto - techoH + 4, pared);
  R(2, alto - 3, ancho - 4, 3, '#a89878');
  const TECHOS = { lab: '#4f7fa8', casa2: '#3f8f6f', centro: '#d84848', gimnasio: '#7a4aa8', gimnasio2: '#7a6a5a', gimnasio3: '#3f8a3a', gimnasio4: '#3a7ab0', gimnasio5: '#2a2040', gimnasio6: '#c83a3a', gimnasio7: '#e06a20', gimnasio8: '#3a3a8a', adobe: '#9a6a3a',
    // templos de los guardianes de las gemas: techo del color de cada clan
    templo_mente: '#c030a0', templo_alma: '#8a4ae0', templo_poder: '#c02828', templo_realidad: '#2a1a2a', templo_espacio: '#2a5ac8', templo_tiempo: '#b08a30' };
  const tc = TECHOS[tipo] || '#c8553a';
  R(0, 0, ancho, techoH, tc);
  let fila = 0;
  for (let yy = 5; yy < techoH - 2; yy += 5, fila++) {
    R(0, yy, ancho, 1, tono(tc, 0.75));
    for (let xx = (fila % 2) * 4; xx < ancho; xx += 8) R(xx, yy - 4, 1, 4, tono(tc, 0.85));
  }
  R(0, 0, ancho, 2, tono(tc, 1.25));
  R(0, techoH - 2, ancho, 2, tono(tc, 0.6));
  if (tipo === 'lab') { R(ancho / 2 - 6, 6, 12, 10, '#f8f8f8'); R(ancho / 2 - 1, 8, 2, 6, '#40a050'); R(ancho / 2 - 4, 10, 8, 2, '#40a050'); }
  else if (tipo === 'centro') {
    // Cartel del CEMIC: cruz roja sobre fondo blanco
    R(ancho / 2 - 8, 5, 16, 13, '#ffffff'); R(ancho / 2 - 8, 5, 16, 1, '#c03030'); R(ancho / 2 - 8, 17, 16, 1, '#c03030');
    R(ancho / 2 - 2, 7, 4, 9, '#e03a3a'); R(ancho / 2 - 5, 10, 10, 3, '#e03a3a');
  } else if (tipo.startsWith('gimnasio')) {
    // Cartel con una estrella (insignia)
    const cx = ancho / 2;
    R(cx - 9, 4, 18, 15, '#f8f0ff'); R(cx - 9, 4, 18, 1, '#4a2a6a');
    R(cx - 1, 6, 2, 11, '#f0c030'); R(cx - 5, 10, 10, 2, '#f0c030'); R(cx - 3, 8, 6, 6, '#f0c030'); R(cx - 1, 10, 2, 2, '#f85888');
  } else if (tipo.startsWith('templo')) {
    // Templo de un guardián: una gema en el frente y columnas de piedra
    const cx = ancho / 2;
    R(cx - 2, 4, 4, 14, '#f8f0ff'); R(cx - 5, 7, 10, 8, '#f8f0ff'); R(cx - 3, 6, 6, 10, tono(tc, 1.6)); R(cx - 1, 8, 2, 3, '#ffffff');
    for (let i = 0; i < w; i++) if (i !== puerta) { R(i * 16 + 5, techoH + 1, 6, alto - techoH - 4, '#f2ece2'); R(i * 16 + 4, techoH, 8, 2, '#b8b0a4'); R(i * 16 + 4, alto - 5, 8, 2, '#b8b0a4'); }
  } else { R(ancho - 14, 3, 6, 8, '#8a6a5a'); R(ancho - 15, 2, 8, 2, '#6a4a3a'); }
  const ventanas = tipo === 'lab' ? [1, 4] : tipo.startsWith('gimnasio') ? [1, 5] : tipo.startsWith('templo') ? [] : [1, 3];
  for (const i of ventanas) {
    if (i === puerta) continue;
    const vx = i * 16 + 2, vy = alto - 26;
    R(vx, vy, 12, 11, '#6a4a2a'); R(vx + 1, vy + 1, 10, 9, '#88c8f0');
    R(vx + 1, vy + 1, 4, 3, '#c0e4ff'); R(vx + 6, vy + 1, 1, 9, '#6a4a2a'); R(vx + 1, vy + 5, 10, 1, '#6a4a2a');
  }
  const dx = puerta * 16;
  if (tipo === 'lab' || tipo.startsWith('gimnasio') || tipo === 'centro') {
    R(dx + 2, alto - 17, 12, 15, '#5a6a7a'); R(dx + 3, alto - 16, 10, 14, '#90d0f0'); R(dx + 7, alto - 16, 2, 14, '#5a6a7a'); R(dx + 4, alto - 15, 2, 4, '#d0f0ff');
  } else {
    R(dx + 3, alto - 16, 10, 14, '#5a3214'); R(dx + 4, alto - 15, 8, 13, '#9a6232'); R(dx + 10, alto - 9, 1, 2, '#f0d060');
  }
  x.strokeStyle = tono(tc, 0.35); x.lineWidth = 1;
  x.strokeRect(0.5, 0.5, ancho - 1, techoH - 1);
  x.strokeStyle = '#7a6a5a';
  x.strokeRect(2.5, techoH - 0.5, ancho - 5, alto - techoH);
  return c;
}

// ===== Criaturas individuales =====
function expPara(nivel) { return nivel * nivel * nivel; }
function recalcular(m) {
  const b = ESPECIES[m.id].base, L = m.nivel;
  m.psMax = Math.floor(2 * b.ps * L / 100) + L + 10;
  m.atk = Math.floor(2 * b.atk * L / 100) + 5;
  m.def = Math.floor(2 * b.def * L / 100) + 5;
  m.vel = Math.floor(2 * b.vel * L / 100) + 5;
}
function crearCriatura(id, nivel) {
  const m = { id, nivel, exp: expPara(nivel), movs: [], habSlot: sortearHab(id) };
  recalcular(m);
  m.ps = m.psMax;
  for (const [nv, mv] of ESPECIES[id].movs) {
    if (nv > nivel || m.movs.some(x => x.id === mv)) continue;
    m.movs.push({ id: mv, pp: MOVS[mv].pp });
    if (m.movs.length > 4) m.movs.shift();
  }
  return m;
}
function curarCriatura(m) {
  m.ps = m.psMax;
  for (const mv of m.movs) mv.pp = MOVS[mv.id].pp;
}
function nombreDe(m) { return m.apodo || ESPECIES[m.id].nombre.toUpperCase(); }
function tiposDe(m) { return (m.et && m.et.tipos) || ESPECIES[m.id].tipos; } // Regiohm cambia de tipo en batalla (m.et.tipos)

// CEMIC: centro donde curan a las criaturas (hay uno en cada pueblo)
function crearCentro(destino, ax, ay, idCentro) {
  return {
    nombre: 'CEMIC',
    grilla: desdeTexto([
      '#########',
      '#k_x_x_p#',
      '#t____tt#',
      '#_______#',
      '#_______#',
      '#p_____p#',
      '#_______#',
      '####m####',
    ]),
    edificios: [],
    salidas: [{ x: 4, y: 7, a: destino, ax, ay, dir: 0 }],
    objetos: {
      k: 'Un estante con vendas, termómetros y frascos de remedios para criaturas.',
      x: 'Un cartel que dice: "CEMIC. Cuidamos a tus criaturas como si fueran nuestras".',
      t: 'El mostrador del CEMIC.',
      p: 'Una planta de mburucuyá con flores violetas.',
    },
    npcs: [
      {
        id: 'rosa', x: 4, y: 2, dir: 0, pal: PAL.rosa,
        hablar: async () => {
          await decir('ENFERMERA ROSA: ¡Bienvenido al CEMIC! ¿Tus criaturas están cansadas?');
          if (!S.equipo.length) { await decir('Ah, todavía no tenés criaturas. ¡Volvé cuando tengas!'); return; }
          curarEquipo();
          S.flags.centro = { mapa: idCentro, x: 4, y: 4, dir: 1 };
          await decir('Las revisamos, las mimamos y... ¡listo! Tus criaturas recuperaron toda su energía.');
          await decir('ENFERMERA ROSA: Si pierden una pelea, te traemos al CEMIC a descansar. ¡Volvé cuando quieras!');
          guardar();
        },
      },
      // El almacén está adentro de cada CEMIC
      { id: 'almacenero', x: 2, y: 2, dir: 0, pal: PAL.almacenero, hablar: () => tienda() },
    ],
  };
}

// Entrenador que pelea una sola vez (queda anotado en S.flags.ent_<id>)
function entrenadorNPC(o) {
  return {
    id: o.id, x: o.x, y: o.y, dir: o.dir, pal: o.pal,
    hablar: async () => {
      const clave = 'ent_' + o.id;
      if (S.flags[clave]) { await decir(o.despues); return; }
      for (const t of o.antes) await decir(t);
      const r = await batalla({ entrenador: { nombre: o.nombre, pal: o.pal, equipo: o.equipo } });
      if (r === 'gana') {
        S.flags[clave] = true;
        await decir(o.gana);
        guardar();
      }
    },
  };
}

// Tomi: pelea una vez y usa el inicial que eligió (base, medio o final)
const TOMI_FORMAS = {
  medio: { flamartija: 'dracobrasa', ajolodo: 'branquiotox', ramoa: 'lianaco' },
  final: { flamartija: 'ignidraxx', ajolodo: 'iberaxolot', ramoa: 'carayarbore' },
};
function tomiNPC(o) {
  return {
    id: o.id, x: o.x, y: o.y, dir: o.dir, pal: PAL.tomi,
    hablar: async () => {
      if (S.flags[o.bandera]) { await decir(o.despues); return; }
      for (const t of o.antes) await decir(t);
      const base = S.flags.inicialTomi || 'ramoa';
      const suyo = o.forma === 'base' ? base : TOMI_FORMAS[o.forma][base];
      const r = await batalla({ entrenador: { nombre: 'TOMI', pal: PAL.tomi, equipo: [...o.equipo, [suyo, o.nivel]] } });
      if (r === 'gana') {
        S.flags[o.bandera] = true;
        await decir(o.gana);

// Las rutas se dibujan "de abajo hacia arriba", pero en el país el viaje sube y baja:
// Córdoba → San Juan va al OESTE, Jujuy → Chaco al ESTE, Chaco → Iberá BAJA,

function moverSalidas(id, haciaMapa, nuevas) {
  const ss = MAPAS[id].salidas.filter(s => s.a === haciaMapa);
  ss.forEach((s, i) => Object.assign(s, nuevas[i]));
}
function llegadas(desde, haciaMapa, nuevas) { moverSalidas(desde, haciaMapa, nuevas); }

// --- Rutas: girarlas ---
// cw = el "arriba" del dibujo pasa a ser el ESTE; ccw = pasa a ser el OESTE; 180 = pasa a ser el SUR
const GIROS = { cw: [2, 3, 1, 0], ccw: [3, 2, 0, 1], '180': [1, 0, 3, 2] };
function girarPunto(giro, x, y, w, h) {
  if (giro === 'cw') return [h - 1 - y, x];
  if (giro === 'ccw') return [y, w - 1 - x];
  return [w - 1 - x, h - 1 - y];
}
function girarMapa(id, giro) {
  const m = MAPAS[id], g = m.grilla, h = g.length, w = g[0].length;
  const P = (x, y) => girarPunto(giro, x, y, w, h), D = d => GIROS[giro][d];
  // las llegadas desde otros mapas
  for (const otro of Object.values(MAPAS)) for (const s of otro.salidas || []) {
    if (s.a !== id) continue;
    [s.ax, s.ay] = P(s.ax, s.ay); s.dir = D(s.dir);
  }
  const nw = giro === '180' ? w : h, nh = giro === '180' ? h : w;
  const ng = Array.from({ length: nh }, () => Array(nw));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const [a, b] = P(x, y); ng[b][a] = g[y][x]; }
  m.grilla = ng;
  for (const s of m.salidas || []) [s.x, s.y] = P(s.x, s.y);
  for (const n of m.npcs || []) { [n.x, n.y] = P(n.x, n.y); n.dir = D(n.dir); }
  if (m.carteles) {
    const c = {};
    for (const [k, v] of Object.entries(m.carteles)) { const [x, y] = k.split(',').map(Number); const [a, b] = P(x, y); c[a + ',' + b] = v; }
    m.carteles = c;
  }
}

// Un encuentro: RECLUTA + JEFE parados en las dos baldosas de la salida. Se van recién cuando les ganás a los dos.
function encuentroClan(o) {
  const c = CLANES[o.clan], vez = o.vez;
  const idR = `clan_${o.clan}${vez}_r`, idJ = `clan_${o.clan}${vez}_j`;
  const listo = () => S.flags['ent_' + idR] && S.flags['ent_' + idJ];
  const recluta = entrenadorNPC({
    id: idR, x: o.r[0], y: o.r[1], dir: o.dir, pal: PAL[c.pal], nombre: 'RECLUTA DEL ' + c.nombre,
    equipo: o.recluta,
    antes: vez === 1
      ? [`RECLUTA: ¡Alto ahí! Por acá no pasa nadie. ¡Somos el ${c.nombre}!`, `Buscamos la ${c.gema}. ¡Y ningún chico nos va a molestar!`]
      : [`RECLUTA: ¡Otra vez vos! El ${c.nombre} no se olvida de los que lo molestan.`, '¡Esta vez no pasás!'],
    gana: 'RECLUTA: ¡No puede ser! ¡Jefe, ayúdeme!',
    despues: `RECLUTA: Nuestras criaturas son todas PSÍQUICAS... ¡y además ${c.tipo === 'PSÍQUICO' ? 'nada más que PSÍQUICAS' : c.tipo.split(' y ')[1]}!`,
  });
  const jefe = entrenadorNPC({
    id: idJ, x: o.j[0], y: o.j[1], dir: o.dir, pal: PAL[c.palJefe], nombre: 'JEFE ' + c.jefe,
    equipo: o.jefe,
    antes: vez === 1
      ? [`${c.jefe}: Así que vos sos el famoso Felipe... Soy ${c.jefe}, jefe del ${c.nombre}.`,
        `En la ${c.gema} duerme ${c.guardian}, su guardián. Cuando lo tengamos, nada nos va a parar.`,
        '¡Correte del camino, nene!']
      : [`${c.jefe}: Felipe... ya tenemos a ${c.guardian} bajo nuestro control.`,
        'Los seis clanes nos vamos a juntar en la cumbre del ACONCAGUA. Ahí está dormido el TITÁN de todas las gemas.',
        '¡Y vos no vas a llegar!'],
    gana: vez === 1
      ? `${c.jefe}: Grr... Ganaste esta vez. Pero el ${c.nombre} va a volver. ¡Nos vamos!`
      : `${c.jefe}: No importa. El plan ya está en marcha. ¡Nos vemos en el ACONCAGUA, Felipe!`,
    despues: `${c.jefe}: ...`,
  });
  recluta.visible = () => !listo();
  jefe.visible = () => !listo();
  const m = MAPAS[o.mapa];
  m.npcs.push(recluta, jefe);
  // Si Felipe quiere salir por ahí (zona = las dos baldosas antes de la salida), el clan le corta el paso.
  // Si pierde una batalla, vuelve al CEMIC; así que después de esto, o les ganó a los dos o ya no está acá.
  m.disparadores = (m.disparadores || []).concat([{
    prueba: (x, y) => !listo() && o.zona.some(([zx, zy]) => zx === x && zy === y),
    accion: async () => {
      const r = npcPorId(idR), j = npcPorId(idJ);
      for (const n of [r, j]) if (n) n.dir = Math.abs(n.x - S.x) > Math.abs(n.y - S.y) ? (n.x > S.x ? 2 : 3) : (n.y > S.y ? 1 : 0);
      await decir(vez === 1 ? `¡Alto! ¡El ${c.nombre} te corta el paso!` : `¡Alto! ¡El ${c.nombre} otra vez!`);
      if (!S.flags['ent_' + idR]) await recluta.hablar();
      if (S.flags['ent_' + idR] && !S.flags['ent_' + idJ] && S.mapa === o.mapa) await jefe.hablar();
    },
  }]);
}

async function despertarRegiohm() {
  const dec = async (k, t) => { const n = npcPorId('cima_' + k); if (n) n.dir = 0; await decir(t); };
  for (let i = 0; i < 2; i++) await pasoForzado(1); // Felipe se acerca al círculo
  await decir('Los jefes de los SEIS CLANES formaron un círculo perfecto en la cumbre...');
  await dec('mente', 'CÓRTEX: ¡Llegó el momento! ¡Guardianes de las gemas, arrodíllense!');
  await decir('REGIMENTO, REGIANIMA, REGIPULSO, REGIFRACTO, REGIÓRBITA y REGICRONO se arrodillaron, cada uno en su lugar.');
  await dec('tiempo', 'CLEPSIDRA: Con sus gemas como llaves vamos a romper el sello de la montaña.');
  await dec('poder', 'MAZO: ¡Todos juntos! ¡AHORA!');
  for (let i = 0; i < 3; i++) await destello(10);
  await decir('¡Las gemas empezaron a girar a toda velocidad! Su luz tiñó el cielo de violeta.');
  await decir('¡Se abrió un PORTAL gigante en la cumbre!');
  await destello(30);
  S.flags.regiohmDesperto = true;
  await decir('Del portal salió... ¡REGIOHM, el TITÁN PRIMIGENIO! Un coloso de mármol blanco con relieves de oro.');
  await decir('REGIOHM extendió sus brazos con calma y empezó a absorber las seis gemas...');
  await dec('realidad', 'ILUSIÓN: ¡No! ¡Se está llevando las gemas! ¡Teníamos que ser NOSOTROS los dueños de su poder!');
  await dec('espacio', 'COMETA: ¡Ataquen! ¡Todas las criaturas a la vez! ¡Tiene que obedecernos!');
  await decir('Cientos de criaturas de los clanes atacaron a REGIOHM...');
  await destello(16);
  await decir('...y la paciencia del TITÁN se rompió. ¡Sus ojos blancos se pusieron ROJOS como el fuego!');
  await decir('¡REGIOHM soltó un RUGIDO PSÍQUICO que hizo temblar toda la montaña! Las máquinas de los clanes quedaron hechas chatarra.');
  await dec('alma', 'ÁNIMA: ¡Se nos fue de las manos! ¡Corran!');
  await fundido(1, 16);
  S.flags.clanesHuyeron = true;
  await esperar(10);
  await fundido(0, 16);
  await decir('Los jefes de los clanes escaparon montaña abajo entre las piedras...');
  await decir('Felipe se quedó solo frente a REGIOHM. ¡Es la última defensa de toda la región!');
  guardar();
  await pelearRegiohm();
}

async function pelearRegiohm() {
  if (!S.equipo.some(m => m.ps > 0)) { await decir('Tus criaturas no tienen energía. ¡Curalas en el CEMIC de PLAZA DE MULAS!'); return; }
  await decir('REGIOHM: ¡¡GROOOOAAAAR!!');
  const r = await batalla({ salvaje: ['regiohm', 80], legendario: true });
  if (r === 'atrapado') {
    S.flags.regiohmAtrapado = true;
    await decir('Los ojos de REGIOHM volvieron a ser blancos. El TITÁN ahora está tranquilo... ¡y es tu compañero!');
    await decir('¡Felipe salvó a toda la región! ¡Sos un verdadero CAMPEÓN de las CRIATURAS CRIOLLAS!');
    guardar();
  } else if (r === 'gana') {
    await decir('REGIOHM cayó sobre la nieve y se quedó quieto, descansando...');
    await decir('Sus ojos todavía brillan. Cuando quieras, podés volver a intentar atraparlo.');
  } else if (r === 'huir') {
    await decir('REGIOHM sigue en la cumbre, esperando...');
  }
}

async function destello(cuadros = 12) {
  for (let i = 0; i <= cuadros; i++) { ui.destello = 1 - i / cuadros; await esperar(1); }
  ui.destello = 0;
}

// Tomi siempre se queda con el inicial que le gana al tuyo
const CONTRA = { ramoa: 'flamartija', flamartija: 'ajolodo', ajolodo: 'ramoa' };

async function mirarBoleadora(b) {
  const tomada = S.flags.inicial === b.id || S.flags.inicialTomi === b.id;
  if (tomada) { await decir('La mesa está vacía.'); return; }
  if (S.flags.inicial) { await decir('Es una boleadora de la Profe. Mejor no tocarla.'); return; }
  if (!S.flags.hablóProfe) { await decir('Hay tres boleadoras sobre la mesa. Mejor hablá primero con la Profesora Ceibo.'); return; }
  const esp = ESPECIES[b.id];
  ui.vista = { id: b.id };
  const si = await siNo(`¿Elegís a ${esp.nombre.toUpperCase()}, ${esp.desc}? Es de tipo ${esp.tipos.map(nombreTipo).join('/')}.`);
  if (!si) { ui.vista = null; return; }
  const m = crearCriatura(b.id, 5);
  S.equipo.push(m);
  S.flags.inicial = b.id;
  await decir(`¡Felipe eligió a ${esp.nombre.toUpperCase()}!`);
  ui.vista = null;
  const rival = CONTRA[b.id];
  S.flags.inicialTomi = rival;
  const tomi = npcPorId('tomi');
  tomi.dir = 2;
  await decir(`TOMI: ¡Entonces yo me quedo con ${ESPECIES[rival].nombre.toUpperCase()}!`);
  await decir('TOMI: ¡Felipe! ¡Probemos nuestras criaturas! ¡Dale, peleemos!');
  const r = await batalla({ entrenador: { nombre: 'TOMI', pal: PAL.tomi, equipo: [[rival, 5]], sinDerrota: true } });
  curarEquipo();
  if (r === 'gana') await decir('TOMI: ¡Uh! ¡Ganaste vos! La próxima vez te gano yo, ¡vas a ver!');
  else await decir('TOMI: ¡Jaja! ¡Gané yo! Pero estuviste cerca, eh.');
  await decir('TOMI: Me voy a entrenar a la Ruta 1. ¡Chau, Profe! ¡Chau, Felipe!');
  S.flags.tomiSeFue = true;
  await entregarRegalos();
}

async function entregarRegalos() {
  await decir('PROFE CEIBO: ¡Qué buen duelo! Ya se nota que van a ser grandes compañeros.');
  await decir('Tomá, esto te va a servir para tu viaje.');
  S.bolsa.boleadora = (S.bolsa.boleadora || 0) + 5;
  S.bolsa.mate = (S.bolsa.mate || 0) + 3;
  await decir('¡Felipe recibió 5 BOLEADORAS y 3 MATES!');
  await decir('PROFE CEIBO: Con las BOLEADORAS podés atrapar criaturas salvajes. Primero debilitalas un poco, ¡así es más fácil!');
  await decir('Y los MATES recuperan la energía de tus criaturas. ¡Andá a explorar la Ruta 1, al norte del pueblo!');
  S.flags.regalos = true;
  guardar();
}

// Un desvío: abre el costado de la ruta y conecta las dos puntas.
// lado = por dónde se sale de la RUTA ('S', 'O', 'N'); celdas = las dos baldosas del borde de la ruta;
// llegada = dónde aparece Felipe al volver a la ruta; entrada = las dos baldosas del borde del desvío.
function desvio(o) {
  const ruta = MAPAS[o.ruta];
  const dirIda = { S: 0, N: 1, O: 2, E: 3 }[o.lado], dirVuelta = { S: 1, N: 0, O: 3, E: 2 }[o.lado];
  // abrir el borde de la ruta (dos baldosas de espesor) con el piso del camino
  for (const [x, y] of o.abrir) ruta.grilla[y][x] = o.piso;
  const d = { S: [0, 1], N: [0, -1], O: [-1, 0], E: [1, 0] }[o.lado];
  o.celdas.forEach(([x, y], i) => {
    const [ex, ey] = o.entrada[i];
    const adentro = [ex + d[0], ey + d[1]]; // la primera baldosa del desvío
    ruta.salidas.push({ x, y, a: o.id, ax: adentro[0], ay: adentro[1], dir: dirIda });
    o.salidas.push({ x: ex, y: ey, a: o.ruta, ax: o.llegada[i][0], ay: o.llegada[i][1], dir: dirVuelta });
  });
  if (o.cartelRuta) { ruta.grilla[o.cartelRuta[1]][o.cartelRuta[0]] = 'S'; ruta.carteles[o.cartelRuta.join(',')] = o.textoRuta; }
  MAPAS[o.id] = {
    nombre: o.nombre, exterior: true, grilla: desdeTexto(AREAS_GRILLAS[o.id]), edificios: [],
    salidas: o.salidas, carteles: o.carteles || {}, objetos: o.objetos, encuentros: o.encuentros, npcs: o.npcs,
  };
}

// Alguien que te regala algo una sola vez
function regaloNPC(o) {
  return {
    id: o.id, x: o.x, y: o.y, dir: o.dir || 0, pal: o.pal,
    hablar: async () => {
      if (S.flags[o.flag]) { for (const t of o.despues) await decir(t); return; }
      for (const t of o.antes) await decir(t);
      for (const [obj, n] of o.da) {
        S.bolsa[obj] = (S.bolsa[obj] || 0) + n;
        await decir(`¡Felipe recibió ${n > 1 ? n + ' ' : ''}${OBJETOS[obj].nombre}!`);
      }
      S.flags[o.flag] = true;
      for (const t of o.final || []) await decir(t);
      guardar();
    },
  };
}

// Una criatura legendaria que se ve en el mapa (como REGIOHM)
function legendarioNPC(o) {
  return {
    id: o.id, x: o.x, y: o.y, dir: o.dir || 0, criatura: o.especie,
    visible: () => !S.flags[o.flag],
    hablar: async () => {
      if (!S.equipo.some(m => m.ps > 0)) { await decir('Tus criaturas no tienen energía. ¡Curalas primero en un CEMIC!'); return; }
      for (const t of o.antes) await decir(t);
      const r = await batalla({ salvaje: [o.especie, o.nivel], legendario: true });
      if (r === 'atrapado') { S.flags[o.flag] = true; for (const t of o.atrapado) await decir(t); guardar(); }
      else if (r === 'gana') { for (const t of o.gana) await decir(t); }
      else await decir(o.huir);
    },
  };
}

// Busca un lugar libre de la ruta, al costado del camino, cerca del medio
function lugarLibre(id, n) {
  const m = MAPAS[id], g = m.grilla, H = g.length, W = g[0].length;
  const ocupado = (x, y) => (m.npcs || []).some(p => p.x === x && p.y === y) || (m.salidas || []).some(s => s.x === x && s.y === y) ||
    (m.carteles || {})[x + ',' + y] || (m.edificios || []).some(e => x >= e.x - 1 && x < e.x + e.w + 1 && y >= e.y - 1 && y < e.y + e.h + 1);
  const cand = [];
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    if (!'.-w:'.includes(g[y][x]) || ocupado(x, y)) continue;
    const vecinos = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => g[y + dy][x + dx]);
    if (!vecinos.some(v => v === '=' || v === 'q' || v === ':')) continue;
    if (vecinos.filter(v => v === '=' || v === 'q').length > 1) continue; // (en las cuevas todo es piso ':') // que no tape una esquina del camino
    cand.push([x, y, Math.abs(x - W / 2) + Math.abs(y - H / 2) + (n || 0) * 3]);
  }
  cand.sort((a, b) => a[2] - b[2]);
  return cand[0];
}
PISTAS_CLANES.forEach(([id, clan, vez, textos], i) => {

  if (!lugar) return;

OBJETOS.cuaderno = { nombre: 'CUADERNO DE PISTAS', precio: 0, cuaderno: true, desc: 'Las adivinanzas de los clanes. Si adivinás de qué gema habla cada una, ¡hay premio!' };
const NOMBRE_GEMA = { mente: 'MENTE', alma: 'ALMA', poder: 'PODER', realidad: 'REALIDAD', espacio: 'ESPACIO', tiempo: 'TIEMPO' };
async function cuadernoPistas() {
  while (true) {
    const tengo = ORDEN_GEMAS.filter(k => S.flags['adiv_' + k]);
    const pedazos = FRASE_CLANES.filter(([k]) => S.flags['frase_' + k]);
    if (!tengo.length && !pedazos.length) { await decir('El cuaderno está vacío. Cuando un clan diga algo raro, Felipe lo va a anotar acá.'); return; }
    const ops = tengo.map(k => (S.flags['adivinado_' + k] ? '✓ ' : '? ') + CLANES[k].jefe);
    if (pedazos.length) ops.push('LA FRASE');
    ops.push('CERRAR');
    await decir('CUADERNO DE PISTAS: ¿Qué querés leer?', { mantener: true });
    const i = await elegir(ops, { x: 132, y: 4, w: 104 });
    ui.dialogo = null;
    if (i < 0 || i === ops.length - 1) return;
    if (pedazos.length && i === ops.length - 2) {
      await decir(`Pedazos que dijeron los jefes (${pedazos.length} de 6):`);
      await decir(FRASE_CLANES.map(([k, t]) => (S.flags['frase_' + k] ? t : '...')).join(' '));
      if (pedazos.length === 6) await decir('¿El TECHO DE AMÉRICA? ¿No es la montaña más alta de todas...?');
      continue;
    }
    const k = tengo[i];
    await decir(`${CLANES[k].jefe} dijo: «${ADIVINANZAS[k]}»`);
    if (S.flags['adivinado_' + k]) { await decir(`¡Ya la adivinaste! Era la ${CLANES[k].gema}.`); continue; }
    if (!await siNo('¿Querés adivinar de qué gema habla?')) continue;
    await decir('¿De qué gema habla?', { mantener: true });
    const r = await elegir([...ORDEN_GEMAS.map(g => NOMBRE_GEMA[g]), 'NO SÉ'], { x: 150, y: 4, w: 86 });
    ui.dialogo = null;
    if (r < 0 || r === 6) continue;
    if (ORDEN_GEMAS[r] === k) {
      S.flags['adivinado_' + k] = true;
      S.plata = (S.plata || 0) + 1000;
      S.bolsa.alfajor = (S.bolsa.alfajor || 0) + 2;
      await decir(`¡SÍ! ¡Es la ${CLANES[k].gema}! ¡Felipe descubrió qué busca el ${CLANES[k].nombre}!`);
      await decir(`Premio: ${plataTxt(1000)} y 2 ALFAJORES.`);
      if (ORDEN_GEMAS.every(g => S.flags['adivinado_' + g]) && !S.flags.cuadernoCompleto) {
        S.flags.cuadernoCompleto = true;
        S.bolsa.boleadora = (S.bolsa.boleadora || 0) + 10;
        await decir('¡Adivinaste las SEIS! ¡Sos un detective de verdad! Premio extra: 10 BOLEADORAS.');
      }
      guardar();
    } else {
      await decir('Mmm... no me cierra. Pensalo un poco más. ¡Probá de nuevo cuando quieras!');
    }
  }
}

    const fin = t + dur;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(ch.vol, t + Math.min(0.8, dur / 3));
    g.gain.setValueAtTime(ch.vol, fin - 0.3); g.gain.linearRampToValueAtTime(0.0001, fin + 0.5);

    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(ch.vol, t + 0.08);
    g.gain.setValueAtTime(ch.vol, fin - 0.25); g.gain.linearRampToValueAtTime(0.0001, fin + 0.2);
    o.connect(g); o.start(t); o.stop(fin + 0.25);
    return;
  }
  const o = ctx.createOscillator();
  if (ch.tipo === 'square') o.setPeriodicWave(ondaCuadrada(ch.duty || 0.5)); else o.type = 'triangle';
  o.frequency.setValueAtTime(fr, t);

  g.gain.linearRampToValueAtTime(ch.vol, t + 0.01);
  if (ch.tipo === 'square') g.gain.setTargetAtTime(ch.vol * 0.6, t + 0.05, 0.1);
  g.gain.setValueAtTime(g.gain.value, fin - 0.02);
  g.gain.linearRampToValueAtTime(0, fin);
  o.connect(g); o.start(t); o.stop(fin + 0.01);
}

function pistaDeseada() {

function musicaTick() {

  if (!MUS.maestro) return;
  const hasta = ctx.currentTime + 0.25;
  for (const ch of MUS.canales) {
    if (ch.t < ctx.currentTime - 0.5) ch.t = ctx.currentTime + 0.05; // si la pestaña estuvo dormida

}

// ---------- Diálogo ----------
async function decir(texto, op = {}) {
  const enBatalla = S.escena === 'batalla';
  const lineas = envolver(texto, enBatalla ? 218 : 214, 8);
  for (let i = 0; i < lineas.length; i += 2) {
    const pag = lineas.slice(i, i + 2), total = pag.join('').length;
    const ultima = i + 2 >= lineas.length;
    ui.dialogo = { lineas: pag, n: 0, total, listo: false, auto: op.auto, mas: !ultima };
    let cuenta = 0;
    while (true) {
      await esperar(1);
      const d = ui.dialogo;
      if (d.n < total) {
        d.n = Math.min(total, d.n + (held.a || held.b ? 4 : 1.25));
        if ((pressed.a || pressed.b) && d.n > 2) d.n = total;
        if (d.n >= total) d.listo = true;
        continue;
      }
      d.listo = true;
      if (op.mantener && ultima) return;
      if (pressed.a || pressed.b) break;
      if (op.auto && ++cuenta >= op.auto) break;
    }
  }
  if (!op.mantener) ui.dialogo = null;
}
function dibujarDialogo() {
  const d = ui.dialogo; if (!d) return;
  const enBatalla = S.escena === 'batalla';
  if (enBatalla) caja(0, 112, W, 48, 'batalla'); else caja(2, 114, W - 4, 44, 'normal');
  let resto = Math.floor(d.n);
  for (let i = 0; i < d.lineas.length; i++) {
    const s = d.lineas[i].slice(0, Math.max(0, resto));
    resto -= d.lineas[i].length;
    if (enBatalla) txt(s, 11, 124 + i * 16, { c: '#ffffff', sombra: '#5a6a7a' });
    else txt(s, 12, 124 + i * 16);
  }
  if (d.listo && !d.auto && (tick >> 4) % 2 === 0) flechaAbajo(enBatalla ? 222 : 220, 146, enBatalla ? '#f8d030' : '#e05050');
}

async function elegir(opciones, op = {}) {
  const cols = op.columnas || 1;
  const m = { opciones, idx: op.inicial || 0, x: op.x ?? 160, y: op.y ?? 4, w: op.w ?? 76, cols };
  ui.menu = m;
  while (true) {
    await esperar(1);
    const n = opciones.length;
    if (pressed.up && m.idx - cols >= 0) m.idx -= cols;
    else if (pressed.down && m.idx + cols < n) m.idx += cols;
    else if (pressed.left && cols > 1 && m.idx % cols > 0) m.idx--;
    else if (pressed.right && cols > 1 && m.idx % cols < cols - 1 && m.idx + 1 < n) m.idx++;
    else if (pressed.up && cols === 1) m.idx = (m.idx - 1 + n) % n;
    else if (pressed.down && cols === 1) m.idx = (m.idx + 1) % n;

function guardar() {

      mapa: S.mapa, x: S.x, y: S.y, dir: S.dir, equipo: S.equipo, caja: S.caja, bolsa: S.bolsa, flags: S.flags, plata: S.plata,

// Si el mapa cambió desde la última partida guardada, lleva a Felipe a un lugar seguro
function acomodarPosicion() {

    !((m.edificios || []).some(e => S.x >= e.x && S.x < e.x + e.w && S.y >= e.y && S.y < e.y + e.h));

// ================= MUNDO =================
function mapa() { return MAPAS[S.mapa]; }
// Felipe va en BALSA si está parado en el agua (o se está metiendo)
function enAgua(m = mapa()) {
  const aca = m.grilla[S.y] && m.grilla[S.y][S.x] === '~';
  const va = S.moviendo && S.prog >= 8 && m.grilla[S.y + DY[S.dir]] && m.grilla[S.y + DY[S.dir]][S.x + DX[S.dir]] === '~';

}
function npcsVisibles(m = mapa()) { return (m.npcs || []).filter(n => !n.visible || n.visible()); }

// ---------- Rocas y bloques de hielo que se rompen con el PICO ----------

async function romperRoca(x, y, ch) {

  if (!(await siNo(`Hay ${que} con grietas. ¿La rompés con el PICO?`))) return;

function pasoMundo() {
  pasoSalvajes();
  if (S.moviendo) {
    S.prog += S.bici ? 8 : held.b ? 4 : 2;
    if (S.prog >= 16) {
      S.prog = 0; S.moviendo = false;
      S.x += DX[S.dir]; S.y += DY[S.dir];
      S.pasoAlt ^= 1;
      alPisar();
      // Anomalías de los templos (temblores, saltos espaciales, mareos)
      if (!S.ocupado && typeof anomaliaPaso === 'function') { const f = anomaliaPaso(); if (f) correr(f()); }
    }
    return;
  }
  if (MP.eventos.length) { correr(atenderMP()); return; }
  if (pressed.start) { correr(menuPrincipal()); return; }
  if (pressed.a) {
    const c = salvajeOcupa(S.x + DX[S.dir], S.y + DY[S.dir]);
    if (c && S.equipo.some(e => e.ps > 0)) { correr(pelearSalvajeVisible(c)); return; }
    interactuar(S.x + DX[S.dir], S.y + DY[S.dir]); return;
  }
  const d = held.up ? 1 : held.down ? 0 : held.left ? 2 : held.right ? 3 : -1;
  if (d < 0) { S.giro = 0; return; }
  if (S.dir !== d) { S.dir = d; S.giro = 6; return; }
  if (S.giro > 0) { S.giro--; return; }
  const choca = S.equipo.some(e => e.ps > 0) && salvajeOcupa(S.x + DX[d], S.y + DY[d]);
  if (choca) { correr(pelearSalvajeVisible(choca)); return; }
  if (transitable(S.x + DX[d], S.y + DY[d])) {
    if (S.bici && mapa().grilla[S.y + DY[d]][S.x + DX[d]] === '~') S.bici = false; // al agua se va en BALSA
    S.moviendo = true; S.prog = 0;
  }
}

async function correr(promesa) {
  S.ocupado = true;
  try { await promesa; } catch (e) { console.error(e); ui.dialogo = null; ui.menu = null; }
  S.ocupado = false;
}

async function pasoForzado(dir) {
  S.dir = dir;
  if (!transitable(S.x + DX[dir], S.y + DY[dir])) return;
  for (let p = 2; p <= 16; p += 2) { S.moviendo = true; S.prog = p; await esperar(1); }
  S.moviendo = false; S.prog = 0;
  S.x += DX[dir]; S.y += DY[dir]; S.pasoAlt ^= 1;
}

function alPisar() {
  const m = mapa();
  const sal = (m.salidas || []).find(s => s.x === S.x && s.y === S.y);
  if (sal) { correr(viajar(sal)); return; }
  for (const d of m.disparadores || []) {
    if (d.prueba(S.x, S.y)) { correr(d.accion()); return; }
  }
  // Los encuentros ya no son al azar: las criaturas se ven en el pasto alto (pasoSalvajes)
}

async function viajar(sal) {
  await fundido(1, 8);
  const antes = S.mapa;
  S.mapa = sal.a; S.x = sal.ax; S.y = sal.ay; S.dir = sal.dir;
  if (!MAPAS[sal.a].exterior) S.bici = false; // adentro se camina
  if (MAPAS[sal.a].exterior && !(MAPAS[antes] && MAPAS[antes].nombre === MAPAS[sal.a].nombre)) {
    S.cartelLugar = { t: 110, txt: MAPAS[sal.a].nombre };

async function interactuar(x, y) {
  const m = mapa();
  const n = npcEn(x, y);
  if (n) {
    n.dir = [1, 0, 3, 2][S.dir];
    await correr(n.hablar());
    return;
  }
  const bol = (m.boleadoras || []).find(o => o.x === x && o.y === y);
  if (bol) { correr(mirarBoleadora(bol)); return; }
  if (y < 0 || y >= m.grilla.length || x < 0 || x >= m.grilla[0].length) return;
  const ch = m.grilla[y][x];
  if (ch === 'S' && m.carteles && m.carteles[x + ',' + y]) { correr(decir(m.carteles[x + ',' + y])); return; }
  if (ROMPIBLE[ch]) { correr(romperRoca(x, y, ch)); return; }
  if (ch === '~' && !S.bolsa.balsa && m.exterior) { correr(decir('El agua es muy profunda para cruzar caminando. Con una BALSA se podría.')); return; }
  if (m.objetos && m.objetos[ch]) { correr(decir(m.objetos[ch])); return; }
}

// ---------- Criaturas salvajes visibles en el pasto alto ----------

    if (!lugarLibreSalvaje(m, x, y)) continue;

    const e = elegirEspecie(m.encuentros);

// ---------- Menú principal ----------
async function menuPrincipal() {

async function tienda() {
  await decir('ALMACENERO: ¡Buenas! ¿Qué vas a llevar?');
  ui.tienda = { idx: 0, cant: 0 };
  while (true) {
    await esperar(1);
    const t = ui.tienda, n = TIENDA.length + 1;
    if (t.cant > 0) {
      const obj = TIENDA[t.idx], precio = OBJETOS[obj].precio;
      const max = Math.max(1, Math.min(99, Math.floor(S.plata / precio)));
      if (pressed.up) t.cant = t.cant >= max ? 1 : t.cant + 1;
      if (pressed.down) t.cant = t.cant <= 1 ? max : t.cant - 1;
      if (pressed.right) t.cant = Math.min(max, t.cant + 10);
      if (pressed.left) t.cant = Math.max(1, t.cant - 10);
      if (pressed.b) t.cant = 0;
      else if (pressed.a) {
        const total = precio * t.cant, cant = t.cant;
        t.cant = 0;
        if (total > S.plata) { await decir('ALMACENERO: Uy, no te alcanza la plata. ¡Ganale a algún entrenador y volvé!'); continue; }
        S.plata -= total;
        S.bolsa[obj] = (S.bolsa[obj] || 0) + cant;
        await decir(`¡Felipe compró ${cant} ${OBJETOS[obj].nombre}! ALMACENERO: ¡Gracias, vuelva prontos!`);
        guardar();
      }
      continue;
    }
    if (pressed.up) t.idx = (t.idx - 1 + n) % n;
    if (pressed.down) t.idx = (t.idx + 1) % n;
    if (pressed.b || (pressed.a && t.idx === TIENDA.length)) break;
    if (pressed.a) {
      if (S.plata < OBJETOS[TIENDA[t.idx]].precio) { await decir('ALMACENERO: Uy, no te alcanza la plata para eso.'); continue; }
      t.cant = 1;
    }
  }
  ui.tienda = null;
  await decir('ALMACENERO: ¡Chau, que te vaya lindo!');
}

async function usarObjetoMundo(obj) {
  const o = OBJETOS[obj];
  if (o.mapa) { await pantallaMapa(); return; }
  if (o.bici) { await usarBici(); return; }
  if (o.cuaderno) { await cuadernoPistas(); return; }
  if (o.balsa) { await decir('Caminá hacia el agua y Felipe se sube a la BALSA solo.'); return; }
  if (o.pico) { await decir('Ponete enfrente de una roca o un bloque de hielo con grietas y apretá A.'); return; }
  if (o.piedra) { await usarPiedra(obj); return; }
  if (!o.cura) { await decir('Ahora no se puede usar eso.'); return; }
  if (!S.equipo.length) { await decir('No tenés criaturas.'); return; }
  const idx = await pantallaEquipo({ modo: 'usar', msg: `¿A quién le das el ${o.nombre}?` });
  if (idx < 0) return;
  const m = S.equipo[idx];
  if (m.ps <= 0) { await decir(`${nombreDe(m)} no tiene energía. Llevalo a descansar a tu casa.`); return; }
  if (m.ps >= m.psMax) { await decir('No va a tener ningún efecto.'); return; }
  const antes = m.ps;
  m.ps = Math.min(m.psMax, m.ps + o.cura);
  S.bolsa[obj]--;
  await decir(`${nombreDe(m)} recuperó ${m.ps - antes} PS.`);
}

// ---------- Pantalla de equipo ----------
async function pantallaEquipo(op) {
  ui.equipo = { idx: 0, msg: op.msg || (op.modo === 'ver' ? 'Tus criaturas.' : 'Elegí una criatura.') };
  while (true) {
    await esperar(1);
    const e = ui.equipo, n = S.equipo.length;
    if (pressed.up) e.idx = (e.idx - 1 + n) % n;
    if (pressed.down) e.idx = (e.idx + 1) % n;
    if (pressed.b && !op.forzado) { ui.equipo = null; return -1; }
    if (pressed.a) {
      if (op.modo === 'ver') {
        const m = S.equipo[e.idx];
        const r = await elegir(['DATOS', 'MOVIMIENTOS', 'APODO', 'SUBIR', 'SALIR'], { x: 140, y: 60, w: 96 });
        if (r === 0) { await verDatos(m); }
        else if (r === 1) { await menuMovimientos(m); }
        else if (r === 2) { await ponerApodo(m); }
        else if (r === 3 && e.idx > 0) {
          [S.equipo[e.idx - 1], S.equipo[e.idx]] = [S.equipo[e.idx], S.equipo[e.idx - 1]];
          e.idx--;

      const idx = e.idx;
      ui.equipo = null;
      return idx;
    }
  }
}
// ---------- Movimientos: NIVEL (ya aprendidos, gratis) y TUTOR ----------
function preEvos(id) {
  const r = [];
  for (const [k, e] of Object.entries(ESPECIES)) {
    const viaNivel = e.evo && e.evo.a === id;
    const viaPiedra = e.evoPiedra && Object.values(e.evoPiedra).includes(id);
    if ((viaNivel || viaPiedra) && !r.includes(k)) r.push(k, ...preEvos(k));
  }
  return r;
}
// Los que ya aprendió por nivel (de su especie o de sus formas anteriores)
function movsNivel(m) {
  const ids = [];
  for (const sp of [m.id, ...preEvos(m.id)])
    for (const [nv, mv] of ESPECIES[sp].movs || []) if (nv <= m.nivel && MOVS[mv] && !ids.includes(mv)) ids.push(mv);
  return ids.map(id => ({ id }));
}
// Movimientos ESPECIALES: los que aprende una sola familia de criaturas (o ninguna). Esos no se enseñan por tipo.
function familia(id) { return [id, ...preEvos(id)].find(k => !preEvos(k).length) || id; }
let _famMov = null;
function familiasDeMov(mv) {
  if (!_famMov) {
    _famMov = {};
    for (const [id, e] of Object.entries(ESPECIES))
      for (const [, x] of e.movs || []) (_famMov[x] = _famMov[x] || new Set()).add(familia(id));
  }
  return _famMov[mv] ? _famMov[mv].size : 0;
}
// Lo que cobra el tutor: más caro cuanto más fuerte es el movimiento
function precioTutor(mv) { const M = MOVS[mv]; return 300 + (M.pot || 0) * 10; }
// Los que todavía no aprendió por nivel + los de sus tipos + los comunes + los extra de su especie
function movsTutor(m) {
  const ya = movsNivel(m).map(x => x.id), L = [];
  const poner = (mv, nv) => { if (MOVS[mv] && mv !== 'forcejeo' && !ya.includes(mv) && !L.some(x => x.id === mv)) L.push(nv ? { id: mv, nv } : { id: mv }); };
  for (const [nv, mv] of ESPECIES[m.id].movs || []) if (nv > m.nivel) poner(mv, nv);
  for (const mv of TUTOR[m.id] || []) poner(mv);
  const tipos = ESPECIES[m.id].tipos;
  for (const [mv, M] of Object.entries(MOVS)) if (tipos.includes(M.tipo) && familiasDeMov(mv) >= 2) poner(mv);
  for (const mv of TUTOR_COMUNES) poner(mv);
  return L;
}
async function menuMovimientos(m) {

async function listaMovimientos(m, modo) {
  const L = modo === 'nivel' ? movsNivel(m) : movsTutor(m);
  if (!L.length) {
    await decir(modo === 'nivel' ? `${nombreDe(m)} todavía no aprendió movimientos por nivel.`
                                 : `El tutor todavía no tiene movimientos para enseñarle a ${nombreDe(m)}.`);

  const li = { m, modo, items: L, idx: 0, top: 0 };
  ui.equipo.lista = li;
  while (true) {
    await esperar(1);
    const n = li.items.length;
    if (pressed.up) li.idx = (li.idx - 1 + n) % n;
    if (pressed.down) li.idx = (li.idx + 1) % n;
    if (li.idx < li.top) li.top = li.idx;
    if (li.idx >= li.top + 6) li.top = li.idx - 5;
    if (pressed.b) break;
    if (pressed.a) {
      const mv = li.items[li.idx].id, M = MOVS[mv];
      if (m.movs.some(x => x.id === mv)) { await decir(`${nombreDe(m)} ya sabe ${M.nombre.toUpperCase()}.`); continue; }
      if (m.movs.length < 4 && modo !== 'tutor') {
        const si = await siNo(`¿Querés que ${nombreDe(m)} aprenda ${M.nombre.toUpperCase()}?`);
        if (!si) continue;
      }
      if (modo === 'tutor') {
        const precio = precioTutor(mv);
        if (S.plata < precio) { await decir(`TUTOR: Enseñar ${M.nombre.toUpperCase()} cuesta ${plataTxt(precio)}, y tenés ${plataTxt(S.plata)}. ¡Ganale a algún entrenador y volvé!`); continue; }
        if (!await siNo(`TUTOR: Te cobro ${plataTxt(precio)} por enseñarle ${M.nombre.toUpperCase()}. ¿Dale?`)) continue;
        const antes = m.movs.map(x => x.id).join();
        await decir(`El tutor le enseña ${M.nombre.toUpperCase()} a ${nombreDe(m)}...`);
        await aprender(m, mv);
        if (m.movs.some(x => x.id === mv) && m.movs.map(x => x.id).join() !== antes) {
          S.plata -= precio;
          await decir(`Pagaste ${plataTxt(precio)}. Te quedan ${plataTxt(S.plata)}.`);
        } else await decir('TUTOR: Bueno, no te cobro nada.');
        continue;
      }
      await aprender(m, mv);
    }
  }
  ui.equipo.lista = null;
}
function descMov(M) {
  const p = [];
  if (M.pot) p.push(`POT ${M.pot}`); 
  p.push(`PREC ${M.prec}`, `PP ${M.pp}`);
  let extra = '';
  if (M.ef === 'atk-') extra = 'Baja el ATAQUE del rival.';
  else if (M.ef === 'def-') extra = 'Baja la DEFENSA del rival.';
  else if (M.ef === 'def+') extra = 'Sube su DEFENSA.';
  else if (M.ef === 'atk++') extra = 'Sube mucho su ATAQUE.';
  else if (M.ef === 'cura') extra = 'Recupera la mitad de sus PS.';
  if (M.prio) extra = (extra ? extra + ' ' : '') + 'Ataca primero.';
  return [p.join('   '), extra];
}

const TECLADO = [
  'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J',
  'K', 'L', 'M', 'N', 'Ñ', 'O', 'P', 'Q', 'R', 'S',

const MAX_APODO = 10;
async function ponerApodo(m, sinCancelar) {
  const especie = ESPECIES[m.id].nombre.toUpperCase();
  const texto = await escribirTexto(`Apodo para ${especie}:`, m.apodo || '', MAX_APODO, m.id, sinCancelar);

  if (!nuevo || nuevo === especie) { delete m.apodo; await decir(`Le dejaste su nombre: ${especie}.`); }
  else { m.apodo = nuevo; await decir(`¡Ahora se llama ${nuevo}!`); }
}
// Teclado en pantalla. Devuelve el texto, o null si se canceló.
async function escribirTexto(titulo, inicial, max, sprite, sinCancelar) {
  const te = { titulo, sprite, max, texto: inicial || '', idx: 0 };
  ui.teclado = te;
  while (true) {
    await esperar(1);
    const n = TECLADO.length, col = te.idx < 30 ? te.idx % 10 : te.idx - 30;
    if (pressed.right) te.idx = (te.idx + 1) % n;
    if (pressed.left) te.idx = (te.idx - 1 + n) % n;
    if (pressed.down) te.idx = te.idx < 20 ? te.idx + 10 : te.idx < 30 ? 30 + Math.min(col, 7) : col;
    if (pressed.up) te.idx = te.idx >= 30 ? 20 + col : te.idx >= 10 ? te.idx - 10 : 30 + Math.min(col, 7);
    if (pressed.b) { if (te.texto) te.texto = te.texto.slice(0, -1); else if (!sinCancelar) { ui.teclado = null; return null; } }
    if (pressed.start && !pressed.a) te.idx = TECLADO.indexOf('LISTO');
    if (pressed.a) {
      const k = TECLADO[te.idx];
      if (k === 'LISTO') break;

      else if (te.texto.length < te.max) te.texto += k === 'ESP' ? ' ' : k;

}
