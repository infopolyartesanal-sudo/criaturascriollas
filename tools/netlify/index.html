<script>
// Esta página va en criaturascriollas.netlify.app: lleva al juego nuevo y le pasa la partida guardada.
var url = 'https://infopolyartesanal-sudo.github.io/criaturascriollas/';
try {
  var partida = localStorage.getItem('criaturas_criollas_v1');
  if (partida) url += '#partida=' + encodeURIComponent(partida);
} catch (e) {}
document.getElementById('ir').href = url;
location.replace(url);
</script>
